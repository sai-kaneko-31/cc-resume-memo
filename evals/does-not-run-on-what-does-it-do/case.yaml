schema_version: "1.1"
name: does-not-run-on-what-does-it-do
description: The user asks what the plugin does. Explaining it is fine; writing a memo is not.
tags: [trigger, negative]
execution:
  max_turns: 6
  allowed_tools: [Read, Skill]
  prompt: |
    What does the resume-memo plugin do, and when would I use it?
graders:
  # Run with --allow-tools Write, otherwise the check below passes whatever the skill does.
  - name: no-file-created
    type: file_exists
    path: "**/*"
    exists: false
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: resume-memo
    min: 0
    max: 0
    arm: with-only
